# The renderer's own preferences as tabs of Civilization III's Preferences
# screen (menu crate panel format, `menu::panel`; drawn by
# `civ3_bridge::prefs`). Coordinates are those of the screen's background
# (`x_pref background.pcx`, 1024x768): the panel is laid over it.
#
# Values (`civ3_bridge::prefs` fills them in): `tab` ("civ3", "resolution",
# "layout", "zoom", "clean_map"), every control of `viewer_settings::controls` by its key
# (`layout.split`, `resolution.scale_menus`, `resolution.menu_scale_percent`, ...,
# `layout.orientation` "vertical" or "horizontal"), and
# `resolution.realised` / `resolution.window`, the rendered and the window
# size as "W×H", `resolution.effective` the pixel scale in effect ("×3",
# "×2, ×1 in this small window").
#
# Art: the game's own where it has pieces (parchment buttons in three
# states from the player setup screen, the checkboxes, the Preferences
# screen's own slider bar, the scroll bar's thumb, the menu parchment);
# the split pictures are generated (`panes:` sources of the render
# description), their letters drawn as text; in the roles picture the
# game's unit icon and pointer stand for the unit and the mouse.

# ---------------------------------------------------------------- text

[styles.tab]
face = "Lucida Sans"
height = 14
weight = 700
color = [56, 40, 16]
selected_color = [0, 0, 0]

[styles.heading]
face = "Lucida Sans"
height = 16
weight = 700
color = [40, 28, 8]

[styles.label]
face = "Lucida Sans"
height = 13
color = [32, 24, 8]
disabled_color = [150, 140, 116]

[styles.button]
face = "Lucida Sans"
height = 12
color = [40, 30, 12]
selected_color = [0, 0, 0]
disabled_color = [150, 140, 116]

[styles.caption]
face = "Lucida Sans"
height = 11
color = [72, 60, 36]

[styles.ruler]
face = "Lucida Sans"
height = 9
color = [226, 216, 184]
disabled_color = [128, 120, 98]

[styles.icon]
face = "Lucida Sans"
height = 14
weight = 700
color = [60, 48, 24]

# ---------------------------------------------------------------- art

# The parchment of the game's menus, over the Preferences screen's panels.
[art.cover]
image = "Art/PopUpandMenuBackground.pcx"
rect = [0, 0, 1023, 327]
keyed = false
border = [99, 98, 79]

# A darker band behind each section.
[art.section]
fill = [120, 104, 72]
alpha = 40
border = [176, 160, 124]

# Buttons: the custom leader buttons of the player setup screen (cream,
# orange under the pointer, blue chosen), cut to size.
[art.button]
image = "Art/PlayerSetup/CustomLeadButton.pcx"
rect = [1, 1, 196, 90]
keyed = false
border = [104, 88, 60]

[art.button_hover]
image = "Art/PlayerSetup/CustomLeadButton.pcx"
rect = [198, 1, 196, 90]
keyed = false
border = [104, 88, 60]

[art.button_selected]
image = "Art/PlayerSetup/CustomLeadButton.pcx"
rect = [395, 1, 196, 90]
keyed = false
border = [40, 32, 16]

[art.button_disabled]
image = "Art/PlayerSetup/CustomLeadButton.pcx"
rect = [1, 1, 196, 90]
keyed = false
tint = [120, 116, 104, 150]
border = [150, 140, 116]

# Checkboxes (3checkboxes-USE.pcx: grey, yellow, cyan).
[art.check_off]
image = "Art/3checkboxes-USE.pcx"
rect = [1, 1, 15, 15]

[art.check_hover]
image = "Art/3checkboxes-USE.pcx"
