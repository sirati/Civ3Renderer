# The renderer's own preferences as tabs of Civilization III's Preferences
# screen (menu crate panel format, `menu::panel`; drawn by
# `civ3_bridge::prefs`). Coordinates are those of the screen's background
# (`x_pref background.pcx`, 1024x768): the panel is laid over it.
#
# Values (`civ3_bridge::prefs` fills them in): `tab` ("civ3", "resolution",
# "layout", "zoom", "clean_map", "accessibility"), every control of `viewer_settings::controls` by its key
# (`layout.split`, `resolution.scale_menus`, `resolution.menu_scale_percent`, ...,
# `layout.orientation` "vertical" or "horizontal"), and
# `resolution.realised` / `resolution.window`, the rendered and the window
# size as "W×H", `resolution.effective` the pixel scale in effect ("×3",
# "×2, ×1 in this small window").
# Also `dialog.changed.<key>` (a slider differs from its accepted value)
# and `dialog.previewing.<name>` / `dialog.preview_offered.<name>` (an eye
# button previews its setting / is shown; names base, menus, windowed).
#
# Art: the game's own where it has pieces (parchment buttons in three
# states from the player setup screen, the checkboxes, the Preferences
# screen's own slider bar, the scroll bar's thumb, the menu parchment);
# the split pictures are generated (`panes:` sources of the render
# description), their letters drawn as text; in the roles picture the
# game's unit icon and pointer stand for the unit and the mouse.

# ---------------------------------------------------------------- text

[styles.tab]
face = "Lucida Sans"
height = 14
weight = 700
color = [56, 40, 16]
selected_color = [0, 0, 0]

[styles.heading]
face = "Lucida Sans"
height = 16
weight = 700
color = [40, 28, 8]

[styles.label]
face = "Lucida Sans"
height = 13
color = [32, 24, 8]
disabled_color = [150, 140, 116]

[styles.button]
face = "Lucida Sans"
height = 12
color = [40, 30, 12]
selected_color = [0, 0, 0]
disabled_color = [150, 140, 116]

[styles.caption]
face = "Lucida Sans"
height = 11
color = [72, 60, 36]

[styles.ruler]
face = "Lucida Sans"
height = 9
color = [226, 216, 184]
disabled_color = [128, 120, 98]

[styles.icon]
face = "Lucida Sans"
height = 14
weight = 700
color = [60, 48, 24]

