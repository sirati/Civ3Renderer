# The renderer's own preferences as tabs of Civilization III's Preferences
# screen (menu crate panel format, `menu::panel`; drawn by
# `civ3_bridge::prefs`). Coordinates are those of the screen's background
# (`x_pref background.pcx`, 1024x768): the panel is laid over it.
#
# Values (`civ3_bridge::prefs` fills them in): `tab` ("civ3", "resolution",
# "layout"), every control of `viewer_settings::controls` by its key
# (`layout.split`, `resolution.menu_scale`, `layout.screens.F1`, ...,
# `layout.orientation` "vertical" or "horizontal"), and
# `resolution.realised` / `resolution.window`, the rendered and the window
# size as "W×H", `resolution.effective` the pixel scale in effect ("×3",
# "Auto (×2)").
#
# Art: the game's own where it has pieces (parchment buttons in three
# states from the player setup screen, the checkboxes, the Preferences
# screen's own slider bar, the scroll bar's thumb, the menu parchment);
# the split pictures are generated (`panes:` sources of the render
# description), their letters drawn as text; in the roles picture the
# game's unit icon and pointer stand for the unit and the mouse.

# ---------------------------------------------------------------- text

[styles.tab]
face = "Lucida Sans"
height = 14
weight = 700
color = [56, 40, 16]
selected_color = [0, 0, 0]

[styles.heading]
face = "Lucida Sans"
height = 16
weight = 700
color = [40, 28, 8]

[styles.label]
face = "Lucida Sans"
height = 13
color = [32, 24, 8]
disabled_color = [150, 140, 116]

[styles.button]
face = "Lucida Sans"
height = 12
color = [40, 30, 12]
selected_color = [0, 0, 0]
disabled_color = [150, 140, 116]

[styles.caption]
face = "Lucida Sans"
height = 11
color = [72, 60, 36]

[styles.icon]
face = "Lucida Sans"
height = 14
weight = 700
color = [60, 48, 24]

# ---------------------------------------------------------------- art

# The parchment of the game's menus, over the Preferences screen's panels.
[art.cover]
image = "Art/PopUpandMenuBackground.pcx"
rect = [0, 0, 1023, 327]
keyed = false
border = [99, 98, 79]

# A darker band behind each section.
[art.section]
fill = [120, 104, 72]
alpha = 40
border = [176, 160, 124]

# Buttons: the custom leader buttons of the player setup screen (cream,
# orange under the pointer, blue chosen), cut to size.
[art.button]
image = "Art/PlayerSetup/CustomLeadButton.pcx"
rect = [1, 1, 196, 90]
keyed = false
border = [104, 88, 60]

[art.button_hover]
image = "Art/PlayerSetup/CustomLeadButton.pcx"
rect = [198, 1, 196, 90]
keyed = false
border = [104, 88, 60]

[art.button_selected]
image = "Art/PlayerSetup/CustomLeadButton.pcx"
rect = [395, 1, 196, 90]
keyed = false
border = [40, 32, 16]

[art.button_disabled]
image = "Art/PlayerSetup/CustomLeadButton.pcx"
rect = [1, 1, 196, 90]
keyed = false
tint = [120, 116, 104, 150]
border = [150, 140, 116]

# Checkboxes (3checkboxes-USE.pcx: grey, yellow, cyan).
[art.check_off]
image = "Art/3checkboxes-USE.pcx"
rect = [1, 1, 15, 15]

[art.check_hover]
image = "Art/3checkboxes-USE.pcx"
rect = [17, 1, 15, 15]

[art.check_on]
image = "Art/3checkboxes-USE.pcx"
rect = [33, 1, 15, 15]

# Sliders: the Preferences screen's own bar (its ends kept), the scroll
# bar's thumb.
[art.track]
image = "Art/interface/x_pref background.pcx"
rect = [259, 551, 408, 23]
keyed = false
slice = [3, 3]

[art.knob]
image = "Art/SCROLL.PCX"
rect = [46, 139, 20, 20]

[art.knob_hover]
image = "Art/SCROLL.PCX"
rect = [46, 139, 20, 20]
tint = [255, 255, 255, 64]

# The splits (100x60 pictures; labels at the middle of each pane, see
# `render_desc::panes_centres`).
[art.panes_Standard]
generated = "panes:60,48,24,255:100x60:standard"
size = [100, 60]
labels = [{ text = "A", at = [50, 30], style = "icon" }]

[art.panes_Vertical1To1]
generated = "panes:60,48,24,255:100x60:vertical11"
size = [100, 60]
labels = [{ text = "A", at = [25, 30], style = "icon" }, { text = "B", at = [75, 30], style = "icon" }]

[art.panes_Vertical2To1]
generated = "panes:60,48,24,255:100x60:vertical21"
size = [100, 60]
labels = [{ text = "A", at = [33, 30], style = "icon" }, { text = "B", at = [83, 30], style = "icon" }]

[art.panes_Horizontal1To1]
generated = "panes:60,48,24,255:100x60:horizontal11"
size = [100, 60]
labels = [{ text = "A", at = [50, 15], style = "icon" }, { text = "B", at = [50, 45], style = "icon" }]

# Roles of the current split: both moved freely (arrows, the divider's
# middle third open) ...
[art.roles_free_Standard]
generated = "panes:60,48,24,255:100x60:standard:free"
size = [100, 60]
labels = [{ text = "A", at = [50, 30], style = "icon" }]

[art.roles_free_Vertical1To1]
generated = "panes:60,48,24,255:100x60:vertical11:free"
size = [100, 60]
labels = [{ text = "A", at = [25, 30], style = "icon" }, { text = "B", at = [75, 30], style = "icon" }]

[art.roles_free_Vertical2To1]
generated = "panes:60,48,24,255:100x60:vertical21:free"
size = [100, 60]
labels = [{ text = "A", at = [33, 30], style = "icon" }, { text = "B", at = [83, 30], style = "icon" }]

[art.roles_free_Horizontal1To1]
