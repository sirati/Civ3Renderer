pass = 5
per_cell_offset = true
blend = { scale = 16 }
sets = ["Fog_Of_War_Images/*"]

# §10.2: units, after the terrain and the fog of war. The animator draws the
# tiles' units row by row, each row from its right end, a tile's units
# (at most two: a moving unit over the one under it) one after the other,
# each as Unit_draw does: team disc, (our ring,) selection cursor, body
# with shadow (an army: its banner art, then its member), HUD. A unit's
# cells carry the offset of where it is from where it would stand
# (crate::units::place); frames come from the cells' phases (the game's own
# frame), not from the clock.
[[layers]]
name = "unit_disc"
category = 4096
pass = 6
descending = true
per_cell_offset = true
sets = ["TeamDisc/*"]
palettes = true

[[layers]]
name = "unit_ring"
category = 4096
pass = 6
descending = true
per_cell_offset = true
sets = ["UnitRing@*"]

[[layers]]
name = "unit_cursor"
category = 4096
offset = [64, 32]
pass = 6
descending = true
per_cell_offset = true
per_cell_phase = true
ticks_per_frame = 0
sets = ["UnitAnim@Art/Animations/Cursor/*"]
palettes = true

