# Civilization III: Conquests — the main map, as the game draws it.
#
# Every number here is a fact about the original renderer, see
# docs/civ3-map-rendering.md (section numbers in comments). Sprites are named
# after the game's own Map_Renderer arrays ("Std_Terrain_Images/540"), so a
# draw list from civ3-bridge's tracer can be compared with ours name by name.
#
# Cells are the map's real tiles (x + y even), on a staggered grid: tile
# (x, y) is cell (x/2, y) with its 128x64 box at (64x, 32y). Things the game
# draws per *vertex* (the point between four tiles: terrain, rivers, fog)
# are stored in the tile below the vertex and anchored 32 px up. Their logical
# position (for the game's tile-range clipping) is the vertex: cull_offset.


# Civ III composes in an RGB555 frame buffer.
[grid]
layout = "staggered"
step = [64, 32]
color_bits = 5

[loader]
# The game composes in 15-bit colour (§11; measured on screenshots).
quantize = "rgb555"
# Palette 255 (magenta) is transparent, 254 is sheet filler (§11).
transparent = [254, 255]

[blank_loader]
# The game keeps every sprite of the map as the box of pixels that are not palette index 255 (sprite
# slicing, §3.1): rows and columns that only hold 254, the filler that is drawn as transparent all
# the same, stay inside it. Sheets with sample_from = "box" find their boxes in this load of their
# images: no per-image alpha or colour tables, only 255 blank.
transparent = [255]
alpha = {}
rgba = {}

