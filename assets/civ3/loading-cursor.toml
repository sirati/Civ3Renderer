# The loading (busy) cursor: the wait cursor's hourglass (the system's
# IDC_WAIT, under Wine the hourglass of Wine's user32.dll, as `viewer_busy`
# in civ3.toml; the game has none of its own and cursor.pcx cell 12 is the
# "NEW UNIT" arrow). The art is one still frame, so it is turned in twelve
# 30-degree steps, pre-rendered (civ3-assets `rotate`): 46x46 frames, the
# hourglass centred and spinning in place. One set for the OS pointer
# (hot spot in the middle), the load-game progress bar and the viewer's
# "Game appears busy / stuck" panel (scene `loading_cursor`).
[images.viewer_loading_cursor]
source = "system-cursor:32514/32"
rotations = 12

[sheets.viewer_loading_cursor]
image = "viewer_loading_cursor"
cell = [46, 46]
grid = [1, 1]
all_frames = true
anchor = [-23, -23]
group = "Viewer@loading_cursor_frame"

[sets."Viewer@loading_cursor/0"]
frames = ["Viewer@loading_cursor_frame/0", "Viewer@loading_cursor_frame/1", "Viewer@loading_cursor_frame/2", "Viewer@loading_cursor_frame/3", "Viewer@loading_cursor_frame/4", "Viewer@loading_cursor_frame/5", "Viewer@loading_cursor_frame/6", "Viewer@loading_cursor_frame/7", "Viewer@loading_cursor_frame/8", "Viewer@loading_cursor_frame/9", "Viewer@loading_cursor_frame/10", "Viewer@loading_cursor_frame/11"]
