[package]
name = "jgl-ffi"
description = "The unsafe shim between Civilization III and the safe jgl crate: jgl.dll's object layouts, thiscall entry points, method-table takeover, counting stubs"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
jgl = { path = "../jgl" }
inproc = { path = "../inproc" }
handoff = { path = "../handoff" }
log.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance"] }

[dev-dependencies]
civ3-ui = { path = "../civ3-ui" }
