
[package]
name = "civ3r-launcher"
description = "Private game installation and process lifecycle for the native renderer"

[package.edition]
workspace = true

[package.license]
workspace = true

[package.version]
workspace = true

[[bin]]
name = "civ3-play-macos"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
sha2 = "0.10.9"

[target]

[target."cfg(unix)"]

[target."cfg(unix)".dependencies]
font8x8 = "0.3"

[target."cfg(unix)".dependencies.winit]
workspace = true

[target."cfg(unix)".dependencies.tile-render]
workspace = true

[target."cfg(unix)".dependencies.civ3-spirv]
path = "../civ3-spirv"

[target."cfg(unix)".dependencies.wgpu]
workspace = true

[target."cfg(unix)".dependencies.pollster]
workspace = true

[target."cfg(unix)".dependencies.civ3r-process]
path = "../civ3r-process"

[target."cfg(unix)".dependencies.function-keys]
git = "ssh://git@github.com/sirati/tilerenderer-gameengine.git"
rev = "b3cc1b2acc3d832902e107389950ca05b418dd0a"

[target."cfg(unix)".dependencies.rustix]
version = "1"
features = ["process", "fs"]

[target."cfg(unix)".dependencies.signal-hook]
version = "0.3"
default-features = false
features = ["iterator"]
