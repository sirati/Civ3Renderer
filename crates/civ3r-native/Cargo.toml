
[package]
name = "civ3r-native"
description = "Native side of the renderer inside a Wine program: unixlib of civ3r_native.dll (Linux, macOS, x64 Windows under the WoW64 port), runs the tile viewer natively"

[package.edition]
workspace = true

[package.license]
workspace = true

[package.version]
workspace = true

[lib]
name = "civ3r_native"
crate-type = ["cdylib", "rlib"]

[dependencies]

[dependencies.wine-unixlib]
git = "ssh://git@github.com/sirati/wine-unixlib-rs.git"
rev = "25af6264b351fd48b6e26720027bf2cf590cc155"

[dependencies.render-errors]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[dependencies.bytemuck]
workspace = true

[dependencies.scene]
git = "ssh://git@github.com/sirati/tilerenderer-gameengine.git"
rev = "7743ac2f3ae3510b5e43ffa9f6cd88941ce57bcb"

[dependencies.log]
workspace = true

[dependencies.civ3-audio]
path = "../civ3-audio"

[target]

[target."cfg(not(target_arch = \"x86\"))"]

[target."cfg(not(target_arch = \"x86\"))".dependencies]

[target."cfg(not(target_arch = \"x86\"))".dependencies.civ3-assets]
path = "../civ3-assets"

[target."cfg(not(target_arch = \"x86\"))".dependencies.handoff]
