[package]
name = "civ3r-native"
description = "Native Linux side of the renderer inside a Wine program: unixlib of civ3r_native.dll, runs the tile viewer natively"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "civ3r_native"
# cdylib: the unixlib (x86_64 Linux); rlib: the argument structs for the
# Windows-side driver.
crate-type = ["cdylib", "rlib"]

[dependencies]
wine-unixlib = { path = "../wine-unixlib" }
bytemuck.workspace = true
scene = { path = "../scene" }
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
civ3-assets = { path = "../civ3-assets" }
render-desc = { path = "../render-desc" }
tile-viewer = { path = "../tile-viewer" }
tile-render.workspace = true
env_logger.workspace = true
