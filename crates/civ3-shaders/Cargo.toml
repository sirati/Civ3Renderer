
[package]
name = "civ3-shaders"
description = "Civ III application shader module: generic viewer entry points and glass effects"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[lib]
crate-type = ["dylib", "lib"]

[dependencies]

[dependencies.viewer-shaders]
git = "ssh://git@github.com/sirati/tilerenderer-gameengine.git"
rev = "ce18a73c1a1885a8d41eda8a87a663953b2d4303"

[dependencies.glass-shaders]
git = "ssh://git@github.com/sirati/glass-shader-rs.git"
rev = "d155523fe2b63dd9130ead8daf35e8825eed860e"

[lints]

[lints.rust]

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ["cfg(target_arch, values(\"spirv\"))"]
