
[package]
name = "civ3-assets"
description = "Readers for Civilization III asset formats (PCX, FLC, INI) and game file lookup"

[package.edition]
workspace = true

[package.license]
workspace = true

[package.version]
workspace = true

[dependencies]

[dependencies.render-errors]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[dependencies.thiserror]
workspace = true

[dependencies.handoff]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[dependencies.render-desc]
optional = true
git = "ssh://git@github.com/sirati/tilerenderer-gameengine.git"
rev = "52a2ec4203168908f1a224fc67396d37e6bebc5e"

[dependencies.tile-render]
workspace = true
optional = true

[dependencies.toml]
version = "0.9"
optional = true

[dependencies.image]
workspace = true
optional = true

[dependencies.gdi-text]
path = "../gdi-text"
optional = true

[dependencies.log]
workspace = true
optional = true

[features]
default = ["render-desc"]
render-desc = ["dep:render-desc", "dep:tile-render", "dep:toml", "dep:image", "dep:gdi-text", "dep:log"]
