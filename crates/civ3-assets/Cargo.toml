[package]
name = "civ3-assets"
description = "Readers for Civilization III asset formats (PCX, FLC, INI) and game file lookup"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
render-errors = { path = "../render-errors" }
thiserror.workspace = true
civ3r-sync = { path = "../civ3r-sync" }
render-desc = { path = "../render-desc", optional = true }
tile-render = { workspace = true, optional = true }
toml = { version = "0.9", optional = true }
image = { workspace = true, optional = true }
gdi-text = { path = "../gdi-text", optional = true }
log = { workspace = true, optional = true }

[features]
default = ["render-desc"]
# Image loader for render descriptions (pulls in the renderer's image type),
# including the game's text glyphs.
render-desc = ["dep:render-desc", "dep:tile-render", "dep:toml", "dep:image", "dep:gdi-text", "dep:log"]
