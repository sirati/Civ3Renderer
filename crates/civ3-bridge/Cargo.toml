[package]
name = "civ3-bridge"
description = "The Civilization III specific part: runs inside the game, turns its state into a game-agnostic scene, and feeds input back"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
# Built as the game's ifc23.dll, see ifc23.def.
name = "ifc23"
crate-type = ["cdylib", "rlib"]

[dependencies]
inproc = { path = "../inproc" }
civ3-sys = { path = "../civ3-sys" }
log.workspace = true
civ3-assets = { path = "../civ3-assets" }
render-desc = { path = "../render-desc" }
scene = { path = "../scene" }
tile-render.workspace = true
tile-viewer = { path = "../tile-viewer" }
thiserror.workspace = true
image.workspace = true
env_logger.workspace = true
