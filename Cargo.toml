
[workspace]
resolver = "3"
members = ["crates/civ3-assets", "crates/civ3-bridge", "crates/civ3-sys", "crates/civ3-ui", "crates/civ3-world", "crates/civ3r-launcher", "crates/civ3r-native", "crates/civ3r-process", "crates/civ3r-viewer", "crates/civ3-spirv", "crates/jgl", "crates/jgl-ffi", "crates/gdi-text"]
exclude = ["crates/civ3-shaders", "vendor"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
thiserror = "2"

[workspace.dependencies.tile-render-shared]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[workspace.dependencies.tile-render]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[workspace.dependencies.bytemuck]
version = "1.24"
features = ["derive", "min_const_generics"]

[workspace.dependencies.wgpu]
version = "30"
features = ["spirv", "vulkan-portability"]

[workspace.dependencies.log]
version = "0.4"
features = ["std"]

[workspace.dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[profile]

[profile.dev]

[profile.dev.package]

[profile.dev.package."*"]
opt-level = 2

[patch]

[patch.crates-io]

[patch.crates-io.wgpu-hal]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[patch.crates-io.winit]
git = "ssh://git@github.com/sirati/pointer-control-rs.git"
rev = "10c22945ee0a9c23084cb85035a1ee44432cabd5"
